name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Inject environment variables
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: |
          echo "window.env = { AIRTABLE_API_KEY: '${{ secrets.AIRTABLE_API_KEY }}', AIRTABLE_BASE_ID: '${{ secrets.AIRTABLE_BASE_ID }}' };" > js/env.js
          echo "console.log('Environment Variables:', window.env);" >> js/env.js

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        continue-on-error: true
        run: npm install

      - name: Prerender Airtable content
        continue-on-error: true
        env:
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: npm run prerender

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          # .gitignore excludes js/env.js (it's generated fresh each run, never
          # committed to the source repo) — but publish_dir is "." so .gitignore
          # itself would otherwise get copied onto gh-pages too, where its own
          # rules then strip js/env.js out of that branch's commit. Excluding
          # .gitignore from the publish keeps the generated file intact.
          exclude_assets: '.gitignore,node_modules'
